# Gradle properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 -Djavax.net.debug=none
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# TLS / Network fixes
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.socketTimeout=60000
systemProp.http.connectionTimeout=60000
systemProp.javax.net.ssl.trustStoreType=JKS

# Local proxy (v2ray/Nekoray on port 10809)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=10809
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=10809
systemProp.http.nonProxyHosts=localhost|127.*|[::1]

# Plugin metadata
pluginGroup=com.aiagent.plugin
pluginVersion=1.0.4
pluginSinceBuild=231
pluginUntilBuild=263.*

# IntelliJ Platform / DataGrip Target
# Supported platformType:
#   IC - IntelliJ IDEA Community
#   IU - IntelliJ IDEA Ultimate
#   DB - DataGrip
platformType=IC
platformVersion=2023.1.5
platformPlugins=
